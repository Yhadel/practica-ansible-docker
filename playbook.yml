---
- name: Automatización de configuración en nodos Ubuntu
  hosts: servidores
  become: yes

  tasks:
    - name: Actualizar caché y paquetes de APT
      apt:
        update_cache: yes
        upgrade: dist

    - name: Crear el usuario 'itla' en cada servidor
      user:
        name: itla
        state: present
        shell: /bin/bash

    - name: Crear la carpeta '/app'
      file:
        path: /app
        state: directory
        mode: '0755'
        owner: root
        group: root

    - name: Crear el archivo 'hola.txt' dentro de /app
      copy:
        dest: /app/hola.txt
        content: "Hola Mundo desde Ansible\nServidor: {{ inventory_hostname }}\n"
        mode: '0644'

    - name: Instalar las aplicaciones 'cowsay' y 'htop'
      apt:
        name:
          - cowsay
          - htop
        state: present